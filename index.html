<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    
    <!-- Menu
    //navbar - barra de navegação do bootstrap navbar-expand-lg - controla a responsividade. A partir de telas lg (large), 
    o menu fica aberto/horizontal. Abaixo disso, pode ficar recolhido no botão sanduíche.
    bg-danger - define a cor de fundo vermelho
    navbar-dark - adapta os textos e ícones do navbar para serem utilizados sobre o fundo escuro
    shadow - adiciona uma sombra ao elemento.-->    
    <nav class="navbar navbar-expand-lg bg-danger navbar-dark shadow">
        <div class="container">
             <!--navbar-brand - estiliza o elemento com a marca/logo da navbar
              fw-bold - deixa o texto em negrito (fw - font-weight)
              fs-4 - define o tamanho da fonte. (fs - font-size) vai até o 6 -->
            <a class="navbar-brand fw-bold fs-4" href="#">
                Bella Pizza
            </a>

            <!-- navbar-toggler - botão responsável por abrir e fechar o menu em telas maiores.
             
            data-bs-toggles="colapse" - infomra que o botão irá mostrar/esconder um elemento.
            
            data-bs-target - Indica qual elemento será aberto ou fechado.
            Nesse caso, procura o elemento que possui id="menu"-->
            <button class="navbar-toggler" type="button" data-bs-toggler="collapse" 
               data-bs-target="menu">
               <!-- navbar-toggler-icon - exige o botão sanduíche -->
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <!-- navbar-nav - organiza a lista como menu de navegação
                  ms-auto - adiciona margem automaticamente no lado inicial (start)
                  ou seja, empurra o item para a direita. (ms - margin-start) -->
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Inicio
                        </a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link active" href="#pizzas">
                            Pizzas
                        </a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link active" href="#sobre">
                            Sobre
                        </a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link active" href="#contato">
                            Contato
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
  </body>
</html>
